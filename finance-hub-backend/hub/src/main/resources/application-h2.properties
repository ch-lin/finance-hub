# =============================================================================
# H2 In-Memory Database Configuration
# =============================================================================
# Spring Boot Data Source Properties (Defaults for local development)
# The following properties are for local development and are overridden by environment
# variables set in docker-compose.yml when running in a container.
spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.url=jdbc:h2:mem:financehub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:file:./data/financehub;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Spring Boot JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.enabled=false
spring.jpa.open-in-view=false

# =============================================================================
# H2 Web Console (Optional but useful for debugging)
# =============================================================================
# You can access the database UI at http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# =============================================================================
# Server & Web Configuration
# =============================================================================
# Server port for local development
server.port=8085

# Enable virtual threads (Project Loom) for better scalability with blocking I/O operations.
spring.threads.virtual.enabled=true

# Default allowed origin for local development
cors.allowed-origin-patterns=http://localhost:3000

# =============================================================================
# Security Configuration
# =============================================================================
# OAuth2 Resource Server Properties
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082

# Disable JWT authentication for local development
app.security.enabled=false

# Make Swagger UI public for local development and testing
app.security.swagger-public=true

# =============================================================================
# Data Import Configuration (Local run via Maven)
# =============================================================================
finance.hub.input.base-path=/Users/edward/Desktop/FinanceHubInput

