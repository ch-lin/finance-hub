# =============================================================================
# Finance Hub Default System Configurations
# =============================================================================
# These properties define the default values of system.

finance.hub.system-config.name=default
finance.hub.system-config.enabled=true
finance.hub.system-config.default-currency=JPY
finance.hub.system-config.file-processing-timeout-seconds=10
finance.hub.system-config.nisa-expected-return-rate=0.05
finance.hub.system-config.ideco-expected-return-rate=0.04
finance.hub.system-config.pension-expected-monthly-salary=500000
finance.hub.system-config.life-expectancy=85
finance.hub.system-config.expense-calculation-past-months=12
finance.hub.system-config.inflation-rate=0.0
finance.hub.system-config.ideco-unlock-age=60
finance.hub.system-config.dc-unlock-age=60
finance.hub.system-config.target-retirement-age=65
finance.hub.system-config.pension-start-age=65

# GA Defaults
finance.hub.system-config.ga-population-size=50
finance.hub.system-config.ga-max-generations=20
finance.hub.system-config.ga-mutation-rate=0.2
finance.hub.system-config.ga-elite-ratio=10

# Simulation Defaults
finance.hub.system-config.simulation-early-repayment-month=12
finance.hub.system-config.retirement-month-mode=DECEMBER

# =============================================================================
# Pension Rule Defaults
