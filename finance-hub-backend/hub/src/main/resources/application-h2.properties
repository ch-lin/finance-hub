finance-hub.pension-rule.kousei-bonus-cap-per-payment=1500000

# =============================================================================
# Finance Hub Default Transaction Source Configurations
# =============================================================================
# These properties define the default values for each transaction source.
# They are automatically created in the database if no configurations exist for that source.

# Credit Card Defaults
finance.hub.transaction-source-configs.credit-card.name=default
finance.hub.transaction-source-configs.credit-card.enabled=true
finance.hub.transaction-source-configs.credit-card.auto-start-import-scheduler=false
finance.hub.transaction-source-configs.credit-card.scheduler-type=CRON
finance.hub.transaction-source-configs.credit-card.fixed-rate=86400000
finance.hub.transaction-source-configs.credit-card.cron-expression=0 0 9,15,21 * * *
finance.hub.transaction-source-configs.credit-card.cron-time-zone=Asia/Taipei

