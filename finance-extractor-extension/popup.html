<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Finance Hub Settings</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 15px; 
            width: 320px; 
            margin: 0;
            color: #333;
        }
        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #FF9900;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        label { 
            font-weight: 600; 
            display: block; 
            margin-bottom: 8px; 
            font-size: 13px;
        }
        input { 
            width: 100%; 
            padding: 8px; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        input:focus {
            outline: none;
            border-color: #FF9900;
        }
        button { 
            background-color: #FF9900; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            width: 100%;
        }
        button:hover { 
            background-color: #e68a00; 
        }
        .status { 
            color: #2c974b; 
            font-size: 13px; 
            margin-top: 10px; 
            text-align: center;
            display: none; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h3>⚙️ Finance Hub Settings</h3>
    
    <label for="backendBaseUrl">Backend Base URL (Host & Port):</label>
    <input type="text" id="backendBaseUrl" placeholder="http://localhost:8080" />
    
    <div style="margin-bottom: 15px; display: flex; align-items: center;">
        <input type="checkbox" id="dryRun" style="width: auto; margin: 0 8px 0 0;" />
        <label for="dryRun" style="margin: 0; font-weight: normal; cursor: pointer;">Dry Run (Preview only, do not save)</label>
    </div>

    <label for="openAllDelay">Open All Delay (ms):</label>
    <input type="number" id="openAllDelay" placeholder="1500" min="0" step="100" />

    <button id="saveBtn">Save Settings</button>
    <div id="status" class="status">✓ Saved successfully!</div>

    <script src="popup.js"></script>
</body>
</html>
